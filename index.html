<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-driving car - No libraries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="carCanvas"></canvas>
    <div id="hud">
        <div class="hud-label">Generation</div>
        <div class="hud-gen" id="statGen">1</div>
        <div class="stat"><span>Alive</span><b id="statAlive">0</b></div>
        <div class="bar"><div id="aliveBar"></div></div>
        <div class="stat"><span>Passed</span><b id="statPassed">0</b></div>
        <div class="stat"><span>Score</span><b id="statScore">0</b></div>
        <div class="stat"><span>Last gen</span><b id="statLast">0</b></div>
        <div class="stat"><span>Record</span><b id="statRecord">0</b></div>
        <div class="hud-divider"></div>
        <button id="skipButton" title="End this generation now and keep its best brain">&#9193; Next gen</button>
        <button id="discardButton" title="Forget the saved brain and start training from scratch">&#10006; Discard</button>
    </div>
    <canvas id="networkCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
